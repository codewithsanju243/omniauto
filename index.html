                  <div className="relative">
                    <input
                      type="text"
                      placeholder="Search by brand, car name or fuel type (e.g. Swift, Thar, Nexon, Creta, EV...)"
                      value={carSearchQuery}
                      onChange={(e) => setCarSearchQuery(e.target.value)}
                      className="w-full bg-surface-850 text-white placeholder-slate-500 pl-11 pr-4 py-3 rounded-2xl border border-white/15 focus:border-brand-yellow focus:outline-none text-sm"
                      autoFocus
                    />
                    <IconSearch className="w-5 h-5 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
                  </div>

                  {/* Filter Pills */}
                  <div className="flex items-center gap-2 overflow-x-auto pb-1 text-xs">
                    {[
                      { id: 'ALL', label: 'All Models (100+)' },
                      { id: 'SUV', label: 'SUVs & 4x4' },
                      { id: 'EV', label: 'Electric & Hybrid' },
                      { id: 'Sedan', label: 'Sedans & Hatchbacks' },
                      { id: '2W', label: '2-Wheelers & Scooty' }
                    ].map(tab => (
                      <button
                        key={tab.id}
                        onClick={() => setSelectedCategoryFilter(tab.id)}
                        className={`px-3 py-1.5 rounded-xl font-bold whitespace-nowrap transition-all ${
                          selectedCategoryFilter === tab.id
                            ? 'bg-brand-yellow text-black'
                            : 'bg-surface-850 text-slate-300 hover:text-white border border-white/10'
                        }`}
                      >
                        {tab.label}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Vehicle Cards Grid (Scrollable) */}
                <div className="max-h-[340px] overflow-y-auto space-y-2 pr-1">
                  {filteredVehicleList.length === 0 ? (
                    <div className="text-center py-8 bg-surface-850/50 rounded-2xl border border-white/5 space-y-3">
                      <p className="text-sm text-slate-300 font-bold">No car found matching "{carSearchQuery}"</p>
                      <button
                        onClick={() => setShowAddCustomForm(true)}
                        className="px-4 py-2 bg-brand-yellow text-black font-bold text-xs rounded-xl"
                      >
                        + Add Custom Vehicle Model
                      </button>
                    </div>
                  ) : (
                    filteredVehicleList.map((car) => {
                      const isSelected = currentCar.id === car.id;
                      return (
                        <div
                          key={car.id}
                          onClick={() => {
                            const originalIndex = allCars.findIndex(c => c.id === car.id);
                            if (originalIndex !== -1) setCarIndex(originalIndex);
                            setCarModalOpen(false);
                          }}
                          className={`p-3.5 rounded-2xl border transition-all cursor-pointer flex items-center justify-between gap-3 ${
                            isSelected
                              ? 'bg-surface-800 border-[#f5a623] shadow-md'
                              : 'bg-surface-850/70 border-white/10 hover:border-white/20 hover:bg-surface-800'
                          }`}
                        >
                          <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-xl bg-white/[0.04] border border-white/10 flex items-center justify-center shrink-0">
                              {car.category === 'Scooter' || car.category === 'Motorcycle' ? (
                                <IconWrench className="w-5 h-5 text-sky-400" />
                              ) : car.type === 'EV' ? (
                                <IconZap className="w-5 h-5 text-emerald-400" />
                              ) : (
                                <IconCar className="w-5 h-5 text-brand-yellow" />
                              )}
                            </div>
                            <div>
                              <strong className="text-sm text-white font-bold block">{car.name}</strong>
                              <span className="text-xs text-slate-400">
                                {car.brand} • <strong className="text-slate-300 font-normal">{car.type}</strong>
                              </span>
                            </div>
                          </div>

                          {isSelected && (
                            <span className="text-xs text-[#f5a623] font-bold bg-[#f5a623]/10 px-3 py-1 rounded-xl border border-[#f5a623]/30">
                              Selected ✓
                            </span>
                          )}
                        </div>
                      );
                    })
                  )}
                </div>

                {/* Add Custom Vehicle Form Accordion */}
                <div className="pt-2 border-t border-white/10">
                  {!showAddCustomForm ? (
                    <button
                      onClick={() => setShowAddCustomForm(true)}
                      className="text-xs font-bold text-brand-yellow hover:underline flex items-center gap-1.5"
                    >
                      <span>+ Can't find your car? Add custom vehicle model</span>
                    </button>
                  ) : (
                    <form onSubmit={handleAddCustomVehicle} className="space-y-3 bg-surface-850 p-4 rounded-2xl border border-white/10">
                      <div className="flex justify-between items-center">
                        <strong className="text-xs text-white">Add Custom Vehicle</strong>
                        <button type="button" onClick={() => setShowAddCustomForm(false)} className="text-[11px] text-slate-400">Cancel</button>
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                        <input
                          type="text"
                          placeholder="Car/Bike Name (e.g. Innova Hycross)"
                          value={customCarName}
                          onChange={(e) => setCustomCarName(e.target.value)}
                          className="bg-surface-900 p-2.5 rounded-xl border border-white/10 text-white"
                          required
                        />
                        <select
                          value={customCarType}
                          onChange={(e) => setCustomCarType(e.target.value)}
                          className="bg-surface-900 p-2.5 rounded-xl border border-white/10 text-white"
                        >
                          <option value="Petrol">Petrol</option>
                          <option value="Diesel">Diesel</option>
                          <option value="EV">Electric (EV)</option>
                          <option value="Hybrid">Hybrid</option>
                        </select>
                      </div>
                      <button
                        type="submit"
                        className="w-full py-2.5 rounded-xl bg-brand-yellow text-black font-bold text-xs uppercase"
                      >
                        Add & Select Vehicle
                      </button>
                    </form>
                  )}
                </div>

              </div>
            </div>
          )}

          {/* SERVICE DETAILS SHEET MODAL */}
          {serviceSheetService && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="w-full max-w-md glass-card rounded-3xl p-6 shadow-2xl space-y-4">
                
                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                  <div className="flex items-center gap-3">
                    <img 
                      src={serviceSheetService.image} 
                      alt={serviceSheetService.title} 
                      className="w-11 h-11 object-contain rounded-xl bg-black/50 p-1 border border-brand-yellow/30"
                    />
                    <div>
                      <h3 className="font-bold text-base sm:text-lg text-white">Service Details</h3>
                      <span className="text-xs text-brand-yellow font-bold">{serviceSheetService.title}</span>
                    </div>
                  </div>
                  <button onClick={() => setServiceSheetService(null)} className="text-slate-400 hover:text-white text-xl">✕</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-400 font-bold uppercase block mb-1">Pick-up Location</label>
                    <div className="relative">
                      <input
                        type="text"
                        value={locationInput}
                        onChange={(e) => setLocationInput(e.target.value)}
                        className="w-full bg-surface-850 text-white pl-9 pr-3 py-3 rounded-xl border border-white/10"
                      />
                      <IconMapPin className="w-4 h-4 text-brand-yellow absolute left-3 top-1/2 -translate-y-1/2" />
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-400 font-bold uppercase block mb-1">Selected Vehicle</label>
                    <div 
                      onClick={() => setCarModalOpen(true)}
                      className="p-3 bg-surface-850 rounded-xl text-white font-bold flex justify-between items-center cursor-pointer hover:border-brand-yellow/50 border border-white/10"
                    >
                      <div className="flex items-center gap-2">
                        <IconCar className="w-4 h-4 text-brand-yellow" />
                        <span>{currentCar.name} ({currentCar.type})</span>
                      </div>
                      <span className="text-xs text-brand-yellow font-semibold">Change ▼</span>
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-400 font-bold uppercase block mb-1">Add problem note (optional)</label>
                    <textarea
                      rows="2"
                      placeholder="Mention the exact problem with your car..."
                      className="w-full bg-surface-850 text-white p-3 rounded-xl border border-white/10"
                    ></textarea>
                  </div>

                  {/* Approx Fare Box */}
                  <div className="p-3.5 bg-surface-850 rounded-2xl border border-white/10 flex justify-between items-center">
                    <div>
                      <span className="text-[10px] text-slate-400 block font-semibold">Estimated Approx Price</span>
                      <strong className="text-lg font-black text-[#f5a623] font-mono">Starting from ₹{serviceSheetService.price}</strong>
                    </div>
                    <span className="text-[11px] text-emerald-400 font-semibold bg-emerald-500/10 px-2.5 py-1 rounded-lg">
                      ⚡ ~5 Min Rapid ETA
                    </span>
                  </div>

                  <button
                    onClick={() => handleBookProvider(PROVIDERS_DATA[0], serviceSheetService.title)}
                    className="w-full py-4 rounded-2xl bg-gradient-to-r from-brand-yellow via-amber-500 to-yellow-400 text-black font-extrabold text-xs uppercase shadow-md hover:scale-105 transition-all"
                  >
                    Confirm & Book Technician →
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* SOS EMERGENCY MODAL */}
          {sosOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="w-full max-w-md glass-card rounded-3xl p-6 space-y-4 text-center border border-red-500/40 shadow-2xl">
                <div className="w-14 h-14 rounded-full bg-red-600/30 border border-red-500 text-red-400 text-2xl mx-auto flex items-center justify-center animate-pulse">
                  <IconShieldAlert className="w-7 h-7" />
                </div>
                <h3 className="text-2xl font-black text-white">OMNIAUTO TECH EMERGENCY SOS</h3>
                <p className="text-xs text-slate-300">
                  Broadcasting instant coordinates to 24/7 central dispatch for <strong>{currentCar.name}</strong>
                </p>
                <div className="p-3.5 rounded-2xl bg-surface-850 text-xs text-left space-y-1.5 text-slate-300 border border-white/5">
                  <div className="flex items-center gap-2">
                    <IconMapPin className="w-4 h-4 text-brand-yellow" />
                    <span>Location: {locationInput}</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <IconTruck className="w-4 h-4 text-red-400" />
                    <span>Priority: Immediate Flatbed & Rapid Rescue Van</span>
                  </div>
                </div>
                <button
                  onClick={() => {
                    handleBookProvider(PROVIDERS_DATA[0], 'EMERGENCY SOS RESCUE');
                    setSosOpen(false);
                  }}
                  className="w-full py-4 rounded-2xl bg-gradient-to-r from-red-600 via-rose-600 to-red-700 text-white font-extrabold text-xs uppercase shadow-lg hover:scale-105 transition-all"
                >
                  DISPATCH EMERGENCY RESCUE
                </button>
                <button onClick={() => setSosOpen(false)} className="text-xs text-slate-400 hover:text-white block mx-auto">
                  Cancel
                </button>
              </div>
            </div>
          )}

          {/* INVOICE / RECEIPT MODAL */}
          {receiptModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="w-full max-w-md glass-card rounded-3xl p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                  <div className="flex items-center gap-2">
                    <IconFileText className="w-5 h-5 text-brand-yellow" />
                    <h3 className="font-bold text-white text-base">Tax Invoice & Receipt</h3>
                  </div>
                  <button onClick={() => setReceiptModal(null)} className="text-slate-400 hover:text-white text-lg">✕</button>
                </div>

                <div className="space-y-2 text-xs text-slate-300 bg-surface-850 p-4 rounded-2xl border border-white/5 font-mono">
                  <div className="flex justify-between border-b border-white/10 pb-2">
                    <span>Invoice Ref:</span>
                    <strong className="text-brand-yellow">{receiptModal.id}</strong>
                  </div>
                  <div className="flex justify-between">
                    <span>Service:</span>
                    <span className="text-white">{receiptModal.service}</span>
                  </div>
                  <div className="flex justify-between">
                    <span>Vehicle:</span>
                    <span className="text-white">{receiptModal.vehicle}</span>
                  </div>
                  <div className="flex justify-between">
                    <span>Assigned Unit:</span>
                    <span className="text-white">{receiptModal.provider}</span>
                  </div>
                  <div className="flex justify-between border-t border-white/10 pt-2 text-sm font-bold text-white">
                    <span>Total Amount Paid:</span>
                    <span className="text-brand-yellow">{receiptModal.amount}</span>
                  </div>
                  <div className="text-[10px] text-emerald-400 text-center pt-2">
                    ● Payment Verified & GST Settled
                  </div>
                </div>

                <button
                  onClick={() => {
                    window.print();
                  }}
                  className="w-full py-3 bg-brand-yellow text-black font-extrabold rounded-xl text-xs uppercase"
                >
                  Print / Save PDF Receipt
                </button>
              </div>
            </div>
          )}

          {/* CALL DIALOG */}
          {callModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="w-72 glass-card rounded-3xl p-6 text-center space-y-3 shadow-2xl">
                <div className="w-12 h-12 rounded-full bg-brand-yellow text-black text-xl mx-auto flex items-center justify-center shadow-md animate-pulse">
                  <IconPhone className="w-6 h-6 text-black" />
                </div>
                <h4 className="font-bold text-white">Calling Paul Sterling</h4>
                <p className="text-xs text-emerald-400">Encrypted Dispatch Channel Active</p>
                <button onClick={() => setCallModal(false)} className="w-full py-2.5 bg-red-600 rounded-xl text-white font-bold text-xs hover:bg-red-500 transition-colors">
                  End Call
                </button>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-white/10 bg-surface-950 px-4 py-8 text-center text-xs text-slate-400 space-y-2">
            <div className="flex items-center justify-center gap-2">
              <div className="bg-white/95 px-2 py-0.5 rounded-lg shadow-sm">
                <img src="assets/Logo.png" alt="OmniAuto Tech Logo" className="h-6 w-auto object-contain" />
              </div>
              <span className="font-bold text-white text-sm">OmniAuto Tech</span>
            </div>
            <p className="text-slate-500">© 2026 OmniAuto Tech Inc. • Certified Roadside Assistance • ICE • EV • HYBRID Support • 24/7 Rapid Dispatch</p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
